[build-system]
requires = ["hatchling>=1.7.0"]
build-backend = "hatchling.build"

[project]
name = "energy_monitor"
version = "0.0.1"
authors = [
  { name="Mattia Silvestri", email="mattiasilvestri27@gmail.com" },
  { name="Francesco Romandini", email="francescoromandini@gmail.com" },
  { name="Giuliano Giari", email="giuliano.giari@gmail.com" },
  ]
description = "Energy monitor"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "energy",
  "monitor",
  "monitoring",
  "co2",
  "consumption"
]
license = {text = "GPLv3"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "beautifulsoup4>=4.11",
  "inquirerpy>=0.3.4",
  "matplotlib>=3.7",
  "numpy>=1.26",
  "platformdirs>=3.0",
  "psutil>=5.9",
  "py-cpuinfo>=9.0",
  "PyQt5>=5.15.9",
  "PyYAML>=6.0",
  "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/MattiaSilvestri/energy-monitor"
Issues = "https://github.com/MattiaSilvestri/energy-monitor/issues"

[project.scripts]
energy-monitor = "energy_monitor.main:main"

[dependency-groups]
dev = [
  "pytest>=7.3",
  "mypy>=1.4",
  "types-beautifulsoup4",
  "types-psutil",
  "types-PyYAML",
  "types-requests",
  "PyQt5-stubs",
]

[tool.hatch.build]
exclude = ["energy_monitor/data/tableExport.json"]

[tool.hatch.build.targets.wheel]
packages = ["energy_monitor"]

[tool.hatch.build.targets.sdist]
include = ["energy_monitor", "README.md", "LICENSE"]
