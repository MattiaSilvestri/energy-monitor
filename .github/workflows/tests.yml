name: Tests

on:
  push:
    branches:
      - main
      - dev
      - binary
  pull_request:
    branches:
      - main
      - dev
  
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: uv sync --python 3.12
    - name: Run tests
      run: uv run pytest
    - name: Run mypy
      run: uv run mypy energy_monitor
